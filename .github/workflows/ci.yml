name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q

      - name: Static consistency checks (HTML ids ↔ JS, routes ↔ fetch calls, imports)
        run: |
          cp .env.example .env
          python sentinel_checker.py

      - name: Offline evaluation + regression gate (clustering F1 ≥ 0.8, verdict accuracy = 1.0)
        run: python eval/run_eval.py --offline --min-clustering-f1 0.8 --min-verdict-acc 1.0

      - name: Frontend syntax check
        run: node --check frontend/app.js

      - name: Docker image builds
        run: docker build -t sentinel-ai:ci .

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          pip install -r requirements.txt
          npm init -y >/dev/null && npm install playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium
      - name: Start app in DEMO_MODE (no keys, no network)
        run: |
          DEMO_MODE=true EXPENSIVE_LIMIT_PER_MINUTE=100 python -m uvicorn api.main:app --port 8765 --log-level warning &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/v1/health && break; sleep 1; done
      - name: Drive every screen with Playwright
        run: E2E_SHOTS=e2e-shots node tests/e2e/ui.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-shots/
