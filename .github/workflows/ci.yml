name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q

      - name: Static consistency checks (HTML ids ↔ JS, routes ↔ fetch calls, imports)
        run: |
          cp .env.example .env
          python sentinel_checker.py

      - name: Offline evaluation (clustering / verdict rule / keyword contradictions)
        run: python eval/run_eval.py --offline

      - name: Docker image builds
        run: docker build -t sentinel-ai:ci .
