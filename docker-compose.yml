# Local full stack: API (+ frontend at http://localhost:8000/app) and MongoDB.
#   docker compose up --build
# With Prometheus + Grafana (dashboard pre-provisioned at http://localhost:3000, admin / admin):
#   docker compose --profile monitoring up --build
# No API keys? Explore the product with fictional data:
#   DEMO_MODE=true docker compose up --build
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env                       # TAVILY_API_KEY, OPENROUTER_API_KEY, optional SENTINEL_API_KEY …
    environment:
      MONGODB_URI: mongodb://mongo:27017   # overrides .env inside the compose network
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]

volumes:
  mongo_data:
